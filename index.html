<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Daily Hold — a shared daily tower defense dare." />
    <title>Daily Hold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sea-teal: #0f766e;
        --coral: #e11d48;
        --amber: #d97706;
        --sage: #a8b5a0;
        --sand: #e8dcc8;
        --ink: #1c1917;
        --foam: #f8faf9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: linear-gradient(165deg, #e8f4f2 0%, var(--foam) 45%, #f3efe6 100%);
        color: var(--ink);
        font-family: Manrope, system-ui, sans-serif;
      }
      #app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem 1rem 1.5rem;
      }
      header.shell {
        width: min(720px, 100%);
        margin-bottom: 0.75rem;
      }
      header.shell h1 {
        font-family: Fraunces, Georgia, serif;
        font-weight: 700;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        margin: 0 0 0.25rem;
        color: var(--sea-teal);
      }
      header.shell p {
        margin: 0;
        opacity: 0.8;
        font-size: 0.95rem;
      }
      #game-host {
        width: min(720px, 100%);
        aspect-ratio: 3 / 4;
        max-height: min(82vh, 960px);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(15, 118, 110, 0.12);
        background: #0b3d3a;
      }
      #game-host canvas {
        display: block;
      }
      .status {
        width: min(720px, 100%);
        margin-top: 0.75rem;
        font-size: 0.85rem;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="shell">
        <h1>Daily Hold</h1>
        <p id="dare-label">Today’s Dare — loading…</p>
      </header>
      <div id="game-host" aria-label="Daily Hold game"></div>
      <p
        class="status"
        id="build-status"
        data-testid="build-status"
        data-ready="false"
      >
        Scaffold ready
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
